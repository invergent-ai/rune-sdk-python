[project]
name = "rune-sdk"
version = "0.1.0"
description = "Python SDK for the Invergent Rune API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Invergent" }
]
maintainers = [
    { name = "Invergent" }
]
requires-python = ">=3.10"
keywords = ["invergent", "rune", "sdk", "api", "ai"]
classifiers = [
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "httpx2>=2.0.0",
    "pydantic>=2.12.0",
    "pydantic-core>=2.41.1",
    "tenacity>=9.0.0",
    "typing-extensions>=4.13.0",
]

[project.optional-dependencies]
http2 = [
    "httpx2[http2]>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/invergent-ai/rune-sdk-python"
Documentation = "https://github.com/invergent-ai/rune-sdk-python#readme"
Changelog = "https://github.com/invergent-ai/rune-sdk-python/blob/main/docs/changelog.md"
Repository = "https://github.com/invergent-ai/rune-sdk-python"
Issues = "https://github.com/invergent-ai/rune-sdk-python/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "gitpython>=3.1.62",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
    "sybil>=9.3.0",
    "syrupy>=6.0.0",
    "tach>=0.35.0",
]
docs = [
    "griffe-pydantic>=1.3.1",
    "mkdocstrings[python]>=1.0.6",
    "ruff>=0.16.6",
    "zensical>=0.0.60",
]
codegen = [
    "datamodel-code-generator>=0.79.0",
]

[tool.pytest.ini_options]
addopts = "-vv -ra --capture=tee-sys -p no:tach"
log_cli = true
log_cli_level = "INFO"
log_level = "INFO"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: live API tests requiring RUNE_API_KEY"]

[tool.deptry]
extend_exclude = [".dagger"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
